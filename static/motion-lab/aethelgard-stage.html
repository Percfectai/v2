<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aethelgard Stage · Percfect 3D World</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #0a0a12;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #ui-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #ffffff;
      font-family: system-ui, 'Segoe UI', sans-serif;
      pointer-events: none;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      max-width: min(420px, 90vw);
      z-index: 10;
    }
    #ui-overlay h1 {
      margin: 0 0 0.25rem;
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }
    #ui-overlay p {
      margin: 0.15rem 0;
      font-size: 0.78rem;
      color: #cbd5e1;
      line-height: 1.4;
    }
    #status {
      margin-top: 0.5rem;
      font-size: 0.72rem;
      color: #86efac;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #status.err { color: #f87171; }
    #links {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      pointer-events: auto;
    }
    #links a {
      font-size: 0.72rem;
      color: #0a0a12;
      background: rgba(134, 239, 172, 0.9);
      text-decoration: none;
      padding: 0.35rem 0.65rem;
      border-radius: 8px;
      font-weight: 700;
      text-align: center;
    }
    #links a.secondary {
      background: rgba(227, 212, 182, 0.9);
    }
  </style>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="ui-overlay">
    <h1>Aethelgard Stage</h1>
    <p>Orbit · pan · zoom with mouse / trackpad</p>
    <p>World GLB via <code>?world=/path.glb</code> — procedural arena if missing</p>
    <div id="status">Booting…</div>
  </div>
  <div id="links">
    <a href="/static/motion-lab/colosseum-duel.html">Colosseum duel →</a>
    <a class="secondary" href="/static/motion-lab/controller.html">17-set controller</a>
  </div>
  <div id="game-canvas"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const params = new URLSearchParams(location.search);
    // Default: try local world path; override with ?world=
    const WORLD_URL = params.get('world') || 'models/aethelgard_world.glb';
    const statusEl = document.getElementById('status');
    const setStatus = (t, err) => {
      statusEl.textContent = t;
      statusEl.classList.toggle('err', !!err);
    };

    let scene, camera, renderer, controls;
    const clock = new THREE.Clock();
    const container = document.getElementById('game-canvas');

    init();
    animate();

    function init() {
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0a0a12);
      scene.fog = new THREE.FogExp2(0x1a1a2e, 0.015);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 15, 25);

      try {
        renderer = new THREE.WebGLRenderer({
          antialias: false,
          powerPreference: 'default',
          failIfMajorPerformanceCaveat: false,
        });
      } catch (e) {
        setStatus('WebGL failed — close other 3D tabs. ' + e.message, true);
        throw e;
      }
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
      container.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 - 0.05;
      controls.target.set(0, 1.5, 0);

      scene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const sunLight = new THREE.DirectionalLight(0xfffaed, 1.2);
      sunLight.position.set(20, 40, 20);
      sunLight.castShadow = true;
      // 2048 is enough for browser; 4096 blows up older GPUs / multi-tab
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      sunLight.shadow.camera.near = 0.5;
      sunLight.shadow.camera.far = 100;
      const d = 30;
      sunLight.shadow.camera.left = -d;
      sunLight.shadow.camera.right = d;
      sunLight.shadow.camera.top = d;
      sunLight.shadow.camera.bottom = -d;
      sunLight.shadow.bias = -0.0005;
      scene.add(sunLight);

      // Procedural ground first so the board is never empty
      addProceduralArena();

      const loader = new GLTFLoader();
      setStatus('Loading world…');
      loader.load(
        WORLD_URL,
        (gltf) => {
          const worldMesh = gltf.scene;
          worldMesh.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
              if (child.material) {
                child.material.roughness = Math.max(child.material.roughness || 0, 0.4);
              }
            }
          });
          // Center on origin
          const box = new THREE.Box3().setFromObject(worldMesh);
          const center = box.getCenter(new THREE.Vector3());
          worldMesh.position.sub(center);
          worldMesh.position.y -= box.min.y - center.y;
          scene.add(worldMesh);
          setStatus('World GLB loaded · ' + WORLD_URL);
          console.log('Digital world loaded successfully.');
        },
        undefined,
        (error) => {
          console.warn('World .glb missing — using procedural arena.', error);
          setStatus('No world GLB at ' + WORLD_URL + ' · procedural arena active');
        }
      );

      window.addEventListener('resize', onWindowResize);
    }

    /** Sand ring + pillars so the stage works without a world file */
    function addProceduralArena() {
      const sand = new THREE.Mesh(
        new THREE.CylinderGeometry(22, 22, 0.6, 48),
        new THREE.MeshStandardMaterial({ color: 0xc4a574, roughness: 0.92 })
      );
      sand.position.y = -0.3;
      sand.receiveShadow = true;
      scene.add(sand);

      const stone = new THREE.MeshStandardMaterial({ color: 0x8b7d6b, roughness: 0.88 });
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        const p = new THREE.Mesh(new THREE.BoxGeometry(2.4, 6, 1.6), stone);
        p.position.set(Math.cos(a) * 26, 3, Math.sin(a) * 26);
        p.lookAt(0, 3, 0);
        p.castShadow = true;
        p.receiveShadow = true;
        scene.add(p);
      }

      const grid = new THREE.GridHelper(50, 25, 0x3d3d55, 0x22223a);
      grid.position.y = 0.02;
      scene.add(grid);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      clock.getDelta();
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
