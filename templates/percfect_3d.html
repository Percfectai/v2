{% extends "base.html" %}
{% block title %}3D Colosseum — Percfect Studios{% endblock %}
{% block content %}
<style>
  .col-wrap { position: relative; width: 100%; height: calc(100vh - 70px); min-height: 520px; background: #07060b; overflow: hidden; }
  .col-canvas { display: block; width: 100%; height: 100%; outline: none; }
  .col-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: .5rem; z-index: 5; pointer-events: none; }
  .col-top button { pointer-events: auto; background: rgba(255,255,255,.08); color: #fff; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: .4rem 1rem; font-size: .8rem; cursor: pointer; }
  .col-top button.active { background: #7c5cfc; border-color: #7c5cfc; }
  .col-hud { position: absolute; top: 56px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 5; pointer-events: none; }
  .col-bar { width: 180px; height: 10px; background: rgba(255,255,255,.1); border-radius: 6px; overflow: hidden; }
  .col-bar > div { height: 100%; background: #4ade80; transition: width .2s; }
  .col-bar.enemy > div { background: #f87171; }
  .col-ctrl { position: absolute; bottom: 16px; left: 16px; z-index: 5; display: flex; flex-direction: column; gap: .4rem; }
  .col-ctrl-row { display: grid; grid-template-columns: 1fr 1fr; gap: .35rem; }
  .col-ctrl button { background: rgba(20,18,30,.9); color: #fff; border: 1px solid rgba(255,255,255,.15); border-radius: 8px; padding: .4rem .7rem; font-size: .78rem; cursor: pointer; }
  .col-ctrl button:hover, .col-ctrl button.active { background: #7c5cfc; }
  .col-stick { width: 110px; height: 110px; border-radius: 50%; background: rgba(20,18,30,.7); border: 1px solid rgba(255,255,255,.15); position: relative; margin-top: .4rem; touch-action: none; }
  .col-stick-knob { width: 42px; height: 42px; border-radius: 50%; background: #7c5cfc; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; }
  .col-phone { position: absolute; bottom: 16px; right: 16px; z-index: 5; width: min(300px, 80vw); height: 380px; background: rgba(15,14,22,.94); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; }
  .col-phone-head { padding: .55rem .75rem; border-bottom: 1px solid rgba(255,255,255,.1); color: #fff; font-weight: 700; font-size: .82rem; }
  .col-phone-body { flex: 1; overflow-y: auto; padding: .5rem .7rem; display: flex; flex-direction: column; gap: .35rem; }
  .col-phone-msg { max-width: 85%; padding: .35rem .55rem; border-radius: 10px; font-size: .76rem; }
  .col-phone-msg.them { background: rgba(124,92,252,.28); color: #e8e0ff; align-self: flex-start; }
  .col-phone-msg.me { background: rgba(255,255,255,.08); color: #ddd; align-self: flex-end; }
  .col-phone-input { display: flex; gap: .35rem; padding: .45rem .55rem; border-top: 1px solid rgba(255,255,255,.1); }
  .col-phone-input input { flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 8px; color: #fff; padding: .3rem .5rem; font-size: .76rem; }
  .col-phone-input button { background: #7c5cfc; color: #fff; border: none; border-radius: 8px; padding: .3rem .65rem; font-size: .76rem; cursor: pointer; }
</style>

<div class="col-wrap">
  <canvas class="col-canvas" id="col-canvas"></canvas>
  <div class="col-top">
    <button class="active" id="btn-colosseum">Colosseum</button>
    <button id="btn-metro">Metro Tunnel</button>
    <button id="btn-cam">Agent Cam</button>
  </div>
  <div class="col-hud">
    <div><div style="color:#fff;font-size:.7rem;margin-bottom:2px">You</div><div class="col-bar"><div id="hp-you" style="width:100%"></div></div></div>
    <div style="text-align:right"><div style="color:#fff;font-size:.7rem;margin-bottom:2px">Agent</div><div class="col-bar enemy"><div id="hp-agent" style="width:100%"></div></div></div>
  </div>
  <div class="col-ctrl">
    <div class="col-ctrl-row">
      <button id="btn-idle">Idle</button>
      <button id="btn-walk">Walk</button>
      <button id="btn-run">Run</button>
      <button id="btn-jump">Jump</button>
      <button id="btn-punch">Punch</button>
      <button id="btn-kick">Kick</button>
    </div>
    <div class="col-stick" id="stick"><div class="col-stick-knob" id="stick-knob"></div></div>
  </div>
  <div class="col-phone">
    <div class="col-phone-head">Messenger</div>
    <div class="col-phone-body" id="phone-body"></div>
    <div class="col-phone-input">
      <input id="phone-input" placeholder="Trash talk…" autocomplete="off">
      <button id="phone-send">Send</button>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const $ = id => document.getElementById(id);
const canvas = $("col-canvas");
const loader = new GLTFLoader();

let renderer, scene, camera, clock = new THREE.Clock();
let you = null, agent = null, mixerYou = null, mixerAgent = null;
let clipsYou = {}, clipsAgent = {}, curYou = null, curAgent = null;
let move = {x:0, y:0}, sceneMode = "colosseum", agentCam = false;
let hpYou = 100, hpAgent = 100;

function buildScene() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(48, 1, 0.1, 120);
  camera.position.set(7, 5, 9);
  scene.add(new THREE.HemisphereLight(0xc9b8ff, 0x1a1426, 1.1));
  const key = new THREE.DirectionalLight(0xfff2d0, 1.4);
  key.position.set(6, 12, 8); key.castShadow = true; scene.add(key);
  buildColosseum();
  buildMetro();
  window.addEventListener("resize", onResize);
  onResize();
}

function onResize() {
  const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || (innerHeight - 70);
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
}

const colGroup = new THREE.Group();
function buildColosseum() {
  const sand = new THREE.Mesh(new THREE.CircleGeometry(8, 64), new THREE.MeshStandardMaterial({color:0xc4a574, roughness:0.95}));
  sand.rotation.x = -Math.PI/2; sand.receiveShadow = true; colGroup.add(sand);
  for (let t = 0; t < 5; t++) {
    const tier = new THREE.Mesh(new THREE.TorusGeometry(4.2 + t*1.15, 0.38, 8, 64), new THREE.MeshStandardMaterial({color:0x3a3448, roughness:0.75}));
    tier.rotation.x = Math.PI/2; tier.position.y = 0.7 + t*0.75; colGroup.add(tier);
  }
  for (let i = 0; i < 8; i++) {
    const a = i / 8 * Math.PI * 2;
    const light = new THREE.PointLight(0xff9a3c, 3, 12);
    light.position.set(Math.cos(a)*6.2, 2.4, Math.sin(a)*6.2);
    colGroup.add(light);
  }
  scene.add(colGroup);
}

const metroGroup = new THREE.Group(); metroGroup.visible = false;
function buildMetro() {
  const tube = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 50, 32, 1, true), new THREE.MeshStandardMaterial({color:0x1c1a22, side:THREE.BackSide}));
  tube.rotation.z = Math.PI/2; metroGroup.add(tube);
  scene.add(metroGroup);
}

function loadChar(url, isYou) {
  loader.load(url, g => {
    const ch = g.scene;
    ch.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    const box = new THREE.Box3().setFromObject(ch);
    const s = 1.7 / Math.max(box.getSize(new THREE.Vector3()).y, 0.01);
    ch.scale.setScalar(s);
    ch.position.y = -box.min.y * s;
    if (isYou) { ch.position.x = -1.5; you = ch; mixerYou = new THREE.AnimationMixer(ch); }
    else { ch.position.x = 1.5; agent = ch; mixerAgent = new THREE.AnimationMixer(ch); }
    scene.add(ch);
    g.animations.forEach(a => {
      const act = (isYou ? mixerYou : mixerAgent).clipAction(a);
      if (isYou) clipsYou[a.name] = act; else clipsAgent[a.name] = act;
    });
    if (isYou) play(clipsYou, Object.keys(clipsYou)[0], true);
    else play(clipsAgent, Object.keys(clipsAgent)[0], false);
  });
}

function play(clips, name, isYou) {
  const act = clips[name];
  if (!act) return;
  const cur = isYou ? curYou : curAgent;
  if (cur === act) return;
  if (cur) cur.fadeOut(0.2);
  act.reset().fadeIn(0.2).play();
  if (isYou) curYou = act; else curAgent = act;
}

function findClip(clips, re) {
  return Object.keys(clips).find(k => re.test(k)) || Object.keys(clips)[0];
}

$("btn-idle").onclick = () => play(clipsYou, findClip(clipsYou, /idle/i), true);
$("btn-walk").onclick = () => play(clipsYou, findClip(clipsYou, /walk/i), true);
$("btn-run").onclick = () => play(clipsYou, findClip(clipsYou, /run/i), true);
$("btn-jump").onclick = () => play(clipsYou, findClip(clipsYou, /jump/i), true);
$("btn-punch").onclick = () => { play(clipsYou, findClip(clipsYou, /punch|hit|attack/i), true); damage("agent"); };
$("btn-kick").onclick = () => { play(clipsYou, findClip(clipsYou, /kick/i), true); damage("agent"); };

function damage(who) {
  if (who === "agent") { hpAgent = Math.max(0, hpAgent - 12); $("hp-agent").style.width = hpAgent + "%"; }
  else { hpYou = Math.max(0, hpYou - 10); $("hp-you").style.width = hpYou + "%"; }
  if (hpYou <= 0 || hpAgent <= 0) setTimeout(reset, 1200);
}
function reset() { hpYou = hpAgent = 100; $("hp-you").style.width = $("hp-agent").style.width = "100%"; }

$("btn-colosseum").onclick = () => { sceneMode = "colosseum"; colGroup.visible = true; metroGroup.visible = false; };
$("btn-metro").onclick = () => { sceneMode = "metro"; colGroup.visible = false; metroGroup.visible = true; };
$("btn-cam").onclick = () => { agentCam = !agentCam; $("btn-cam").textContent = agentCam ? "Your Cam" : "Agent Cam"; };

const stick = $("stick"), knob = $("stick-knob");
let drag = false;
function setStick(cx, cy) {
  const r = 34;
  let dx = cx - 55, dy = cy - 55;
  const len = Math.hypot(dx, dy);
  if (len > r) { dx *= r/len; dy *= r/len; }
  knob.style.left = (55 + dx) + "px";
  knob.style.top = (55 + dy) + "px";
  move.x = dx / r; move.y = -dy / r;
}
stick.addEventListener("pointerdown", e => { drag = true; setStick(e.offsetX, e.offsetY); });
window.addEventListener("pointermove", e => { if (drag) setStick(e.offsetX, e.offsetY); });
window.addEventListener("pointerup", () => { drag = false; knob.style.left = knob.style.top = "50%"; move.x = move.y = 0; });

document.addEventListener("keydown", e => {
  if (e.key === "w" || e.key === "ArrowUp") move.y = 1;
  if (e.key === "s" || e.key === "ArrowDown") move.y = -1;
  if (e.key === "a" || e.key === "ArrowLeft") move.x = -1;
  if (e.key === "d" || e.key === "ArrowRight") move.x = 1;
  if (e.key === " ") { play(clipsYou, findClip(clipsYou, /jump/i), true); e.preventDefault(); }
});
document.addEventListener("keyup", e => {
  if (["w","s","ArrowUp","ArrowDown"].includes(e.key)) move.y = 0;
  if (["a","d","ArrowLeft","ArrowRight"].includes(e.key)) move.x = 0;
});

function addMsg(text, who) {
  const el = document.createElement("div");
  el.className = "col-phone-msg " + who;
  el.textContent = text;
  $("phone-body").appendChild(el);
  $("phone-body").scrollTop = $("phone-body").scrollHeight;
}
$("phone-send").onclick = () => {
  const v = $("phone-input").value.trim();
  if (!v) return;
  addMsg(v, "me");
  $("phone-input").value = "";
  setTimeout(() => addMsg(["Nice try.","You're slow.","Come closer."][Math.floor(Math.random()*3)], "them"), 800);
};

function loop() {
  requestAnimationFrame(loop);
  const dt = clock.getDelta();
  if (mixerYou) mixerYou.update(dt);
  if (mixerAgent) mixerAgent.update(dt);

  if (you && (move.x || move.y)) {
    you.position.x += move.x * dt * 3.2;
    you.position.z += move.y * dt * 3.2;
    you.rotation.y = Math.atan2(move.x, move.y);
    play(clipsYou, findClip(clipsYou, Math.hypot(move.x,move.y) > 0.55 ? /run/i : /walk/i), true);
  }

  if (agent && you) {
    const dx = you.position.x - agent.position.x;
    const dz = you.position.z - agent.position.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1.8) {
      agent.position.x += (dx / dist) * dt * 1.6;
      agent.position.z += (dz / dist) * dt * 1.6;
      agent.rotation.y = Math.atan2(dx, dz);
      play(clipsAgent, findClip(clipsAgent, /walk|run/i), false);
    } else {
      play(clipsAgent, findClip(clipsAgent, /punch|kick|attack|idle/i), false);
      if (Math.random() < 0.015) damage("you");
    }
  }

  if (agentCam && agent) {
    camera.position.lerp(new THREE.Vector3(agent.position.x - 2, 2.2, agent.position.z + 4), 0.08);
    camera.lookAt(agent.position.x, 1.2, agent.position.z);
  } else if (you) {
    camera.position.lerp(new THREE.Vector3(you.position.x + 6, 4.5, you.position.z + 8), 0.06);
    camera.lookAt(you.position.x, 1, you.position.z);
  }
  renderer.render(scene, camera);
}

buildScene();
loadChar("/static/RIGGED_poyo_walking.glb", true);
loadChar("/static/RIGGED_poyo_running.glb", false);
addMsg("Agent online. Try me.", "them");
loop();
</script>
{% endblock %}
